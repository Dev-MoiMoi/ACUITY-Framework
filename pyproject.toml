[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acuity-framework"
version = "2.0.3"
description = "ACUITY — A machine learning framework for extracting, verifying, and recommending local micro-enterprise profiles from unstructured community posts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ACUITY Research Team"},
]
keywords = [
    "nlp",
    "ner",
    "recommendation-engine",
    "tfidf",
    "cosine-similarity",
    "business-extraction",
    "community-posts",
    "micro-enterprise",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# Core dependencies (no heavy ML libraries required by default)
dependencies = []

[project.optional-dependencies]
# NLP dependencies for the extraction pipeline
nlp = [
    "nltk>=3.8.1",
]

# Transformer-based NER (heavier, GPU-optional)
transformers = [
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "nltk>=3.8.1",
]

# Facebook scraper
scraper = [
    "undetected-chromedriver>=3.5.0",
    "selenium>=4.15.0",
    "python-dotenv>=1.0.0",
]

# All optional dependencies
all = [
    "nltk>=3.8.1",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "undetected-chromedriver>=3.5.0",
    "selenium>=4.15.0",
    "python-dotenv>=1.0.0",
]

# Development / testing
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Repository = "https://github.com/acuity-framework/acuity-framework"
Documentation = "https://github.com/acuity-framework/acuity-framework#readme"

[tool.setuptools.packages.find]
include = ["acuity*"]
